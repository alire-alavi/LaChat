version: '3.9'

services:
    db:
        image: postgres:15-alpine
        container_name: group-chat-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: groupchat
            POSTGRES_PASSWORD: groupchatpass
            POSTGRES_DB: groupchatdb
        ports:
            - '5432:5432'
        volumes:
            - db_data:/var/lib/postgresql/data

    backend:
        build:
            context: ./group-chat-backend
            dockerfile: Dockerfile
        container_name: group-chat-backend
        restart: unless-stopped
        depends_on:
            - db
        ports:
            - '3000:8000'
        volumes:
            - ./group-chat-backend:/usr/src/app
            - /usr/src/app/node_modules

volumes:
    db_data:
